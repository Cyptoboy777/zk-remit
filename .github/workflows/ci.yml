name: CI — compile Compact, test, build

on:
  push:
    branches: [main, testnet-live, wave3-top, wave3-master]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compactc: ["0.36.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install compactc ${{ matrix.compactc }}
        run: |
          ./scripts/install-compactc.sh ${{ matrix.compactc }}
          echo "$HOME/.local/compactc-${{ matrix.compactc }}" >> "$GITHUB_PATH"
      - name: Compile contract (with ZK keys)
        run: compactc contract/src/zk-remit.compact contract/src/managed/zk-remit
      - run: npm ci
        if: matrix.compactc == '0.36.1'
      - name: Unit tests (Compact runtime simulator)
        if: matrix.compactc == '0.36.1'
        run: npm test -w contract -- --reporter=verbose
      - name: Unit tests (deployment loading, backend selection, friendly errors)
        if: matrix.compactc == '0.36.1'
        run: npm test -w frontend -- --reporter=verbose
      - name: Typecheck deploy tooling
        if: matrix.compactc == '0.36.1'
        run: npm run typecheck -w scripts
      - name: Typecheck + build frontend
        if: matrix.compactc == '0.36.1'
        run: npm run build -w frontend
      - name: Save built app for preview
        if: matrix.compactc == '0.36.1'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Dependency audit (production dependencies)
        if: matrix.compactc == '0.36.1'
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Browser smoke test under the shipped CSP
        if: matrix.compactc == '0.36.1'
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          (npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          npx -y wait-on@8 http://localhost:4173 --timeout 60000
          node ci/smoke.mjs http://localhost:4173
      - name: Lighthouse (home and claim link)
        if: matrix.compactc == '0.36.1'
        working-directory: frontend
        run: node ci/lighthouse.mjs http://localhost:4173 lighthouse
      - name: Save Lighthouse reports
        if: always() && matrix.compactc == '0.36.1'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: frontend/lighthouse
          if-no-files-found: ignore
          retention-days: 14
