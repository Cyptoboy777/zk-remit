name: CI — compile Compact, test, build

on:
  push:
    branches: [main, testnet-live, wave3-top]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compactc: ["0.36.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install compactc ${{ matrix.compactc }}
        run: |
          ./scripts/install-compactc.sh ${{ matrix.compactc }}
          echo "$HOME/.local/compactc-${{ matrix.compactc }}" >> "$GITHUB_PATH"
      - name: Compile contract (with ZK keys)
        run: compactc contract/src/zk-remit.compact contract/src/managed/zk-remit
      - run: npm ci
        if: matrix.compactc == '0.36.1'
      - name: Unit tests (Compact runtime simulator)
        if: matrix.compactc == '0.36.1'
        run: npm test -w contract -- --reporter=verbose
      - name: Unit tests (deployment loading, backend selection, friendly errors)
        if: matrix.compactc == '0.36.1'
        run: npm test -w frontend -- --reporter=verbose
      - name: Typecheck deploy tooling
        if: matrix.compactc == '0.36.1'
        run: npm run typecheck -w scripts
      - name: Typecheck + build frontend
        if: matrix.compactc == '0.36.1'
        run: npm run build -w frontend
      - name: Save built app for preview
        if: matrix.compactc == '0.36.1'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
