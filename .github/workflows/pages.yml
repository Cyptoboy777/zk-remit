name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /zk-remit/
      VITE_NETWORK_ID: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install compactc 0.31.1
        run: |
          ./scripts/install-compactc.sh 0.31.1
          echo "$HOME/.local/compactc-0.31.1" >> "$GITHUB_PATH"
      - name: Compile Compact contract (circuits + prover/verifier keys)
        run: compactc contract/src/zk-remit.compact contract/src/managed/zk-remit
      - run: npm ci
      - run: npm test -w contract
      - run: npm run build -w frontend
      - run: cp frontend/dist/index.html frontend/dist/404.html && touch frontend/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
